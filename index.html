<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Professional Glassmorphism Login</title>
        <link
            href="https://fonts.googleapis.com/css2?
family=Poppins:wght@300;400;500; 600&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax /libs/font-awesome/6.0.0/css/all.min.css" />
        <link rel="stylesheet" href="css\index.css" />
    </head>
    <body>
        <div class="login-box">
            <h2>Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="Username" required />
                    <label>Username</label>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="Password" required />
                    <label>Password</label>
                </div>
                <button type="submit" class="login-btn" id="btn">Sign In</button>
                <p class="signup-link">Don't have an account? <a href="2.html">Create account</a></p>
            </form>
        </div>

        <script src="js\index.js"></script>
        <script src="js\SmoothScroll.js"></script>
        <script>
            document.getElementById("loginForm").addEventListener("submit", function (e) {
                e.preventDefault();

                let Username = document.getElementById("Username").value;
                let Password = document.getElementById("Password").value;

                localStorage.setItem("nome", Username);
                localStorage.setItem("senha", Password);

                // redireciona
                window.location.href = "cyberpunk.html";
            });
        </script>
    </body>
</html>
