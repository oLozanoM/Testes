<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SnackNight — Cyberpunk</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap"
            rel="stylesheet"
        />
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            :root {
                --cyan: #00f5ff;
                --cyan-dim: #00b8c8;
                --magenta: #ff2d78;
                --purple: #7b2fff;
                --yellow: #ffe600;
                --bg: #050a12;
                --bg2: #0a1220;
                --bg3: #0f1a2e;
                --text: #e0eeff;
                --muted: #5a7a9a;
                --white: #ffffff;
                --card-r: 4px;
            }

            body {
                font-family: "DM Sans", sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                overflow-x: hidden;
            }

            /* scanlines overlay */
            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background: repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 245, 255, 0.015) 2px,
                    rgba(0, 245, 255, 0.015) 4px
                );
                pointer-events: none;
                z-index: 0;
            }

            /* HEADER */
            header {
                padding: 1.25rem 2.5rem;
                display: flex;
                align-items: center;
                gap: 12px;
                border-bottom: 1px solid rgba(0, 245, 255, 0.15);
                background: rgba(5, 10, 18, 0.9);
                backdrop-filter: blur(10px);
                position: relative;
                z-index: 10;
            }

            header::after {
                content: "";
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                height: 1px;
                background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
            }

            .logo-text {
                font-family: "Orbitron", monospace;
                font-size: 18px;
                font-weight: 900;
                letter-spacing: 2px;
                color: var(--cyan);
                text-shadow: 0 0 20px rgba(0, 245, 255, 0.6);
            }
            .logo-text span {
                color: var(--magenta);
                text-shadow: 0 0 20px rgba(255, 45, 120, 0.6);
            }

            /* NAV */
            .fnav-wrap {
                display: flex;
                justify-content: center;
                padding: 16px 0 8px;
                position: relative;
                z-index: 10;
            }

            .fnav {
                position: relative;
                display: inline-flex;
                align-items: center;
                padding: 4px;
                gap: 2px;
                white-space: nowrap;
                background: rgba(10, 18, 32, 0.9);
                border-radius: 4px;
                border: 1px solid rgba(0, 245, 255, 0.25);
                box-shadow: 0 0 20px rgba(0, 245, 255, 0.08), inset 0 0 20px rgba(0, 245, 255, 0.03);
            }

            .fnav::before {
                content: "";
                position: absolute;
                inset: -1px;
                border-radius: 4px;
                background: linear-gradient(90deg, var(--cyan), var(--purple), var(--magenta));
                z-index: -1;
                opacity: 0.4;
            }

            .fnav-pill {
                position: absolute;
                height: calc(100% - 8px);
                top: 4px;
                border-radius: 2px;
                background: rgba(0, 245, 255, 0.12);
                border: 1px solid rgba(0, 245, 255, 0.4);
                box-shadow: 0 0 12px rgba(0, 245, 255, 0.2);
                /* Transição suave corrigida */
                transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1), width 0.3s cubic-bezier(0.25, 1, 0.5, 1);
                pointer-events: none;
                box-sizing: border-box;
            }

            .fnav-item {
                font-size: 12px;
                font-family: "Orbitron", monospace;
                font-weight: 400;
                color: var(--muted);
                padding: 7px 16px;
                border-radius: 2px;
                cursor: pointer;
                border: none;
                background: transparent;
                z-index: 1;
                white-space: nowrap;
                position: relative;
                transition: color 0.2s;
                letter-spacing: 1px;
            }
            .fnav-item:hover {
                color: var(--cyan);
            }
            .fnav-item.active {
                color: var(--cyan);
                font-weight: 700;
                text-shadow: 0 0 10px rgba(0, 245, 255, 0.8);

                /* O efeito do pill direto no elemento ativo */
                background: rgba(0, 245, 255, 0.12);
                border: 1px solid rgba(0, 245, 255, 0.4);
                box-shadow: 0 0 12px rgba(0, 245, 255, 0.2);
            }

            /* HERO */
            .hero {
                text-align: center;
                padding: 3rem 1rem 2rem;
                position: relative;
                z-index: 1;
            }

            .hero-tag {
                display: inline-block;
                background: transparent;
                color: var(--cyan);
                font-size: 10px;
                font-family: "Orbitron", monospace;
                font-weight: 700;
                letter-spacing: 3px;
                text-transform: uppercase;
                padding: 5px 14px;
                border-radius: 2px;
                margin-bottom: 1rem;
                border: 1px solid rgba(0, 245, 255, 0.3);
                box-shadow: 0 0 12px rgba(0, 245, 255, 0.1);
            }

            .hero h1 {
                font-family: "Orbitron", monospace;
                font-size: clamp(22px, 3.5vw, 38px);
                font-weight: 900;
                line-height: 1.2;
                max-width: 600px;
                margin: 0 auto 0.75rem;
                color: var(--text);
                letter-spacing: 2px;
            }

            .hero h1 em {
                font-style: normal;
                color: var(--cyan);
                text-shadow: 0 0 20px rgba(0, 245, 255, 0.5);
            }

            .hero p {
                color: var(--muted);
                font-size: 14px;
                font-weight: 300;
                max-width: 400px;
                margin: 0 auto;
                letter-spacing: 0.5px;
            }

            /* GRID */
            .grid-section {
                padding: 2rem 2.5rem 4rem;
                max-width: 1240px;
                margin: 0 auto;
                position: relative;
                z-index: 1;
            }

            .section-label {
                font-size: 10px;
                font-family: "Orbitron", monospace;
                font-weight: 700;
                letter-spacing: 3px;
                text-transform: uppercase;
                color: var(--cyan);
                margin-bottom: 1.5rem;
                padding-left: 2px;
                opacity: 0.7;
            }

            .cards-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
            }

            @media (max-width: 900px) {
                .cards-grid {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
            @media (max-width: 520px) {
                .cards-grid {
                    grid-template-columns: repeat(2, 1fr);
                    gap: 10px;
                }
                .grid-section {
                    padding: 1.5rem 1rem 3rem;
                }
            }

            /* CARD */
            .card {
                border-radius: var(--card-r);
                overflow: hidden;
                background: var(--bg2);
                border: 1px solid rgba(0, 245, 255, 0.1);
                transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
                cursor: pointer;
                display: flex;
                flex-direction: column;
                text-decoration: none;
                color: inherit;
                position: relative;
            }

            .card::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 2px;
                background: linear-gradient(90deg, var(--cyan), var(--purple));
                opacity: 0;
                transition: opacity 0.3s;
                z-index: 5;
            }

            .card:hover {
                transform: translateY(-6px);
                box-shadow: 0 0 30px rgba(0, 245, 255, 0.15), 0 16px 40px rgba(0, 0, 0, 0.5);
                border-color: rgba(0, 245, 255, 0.35);
            }

            .card:hover::before {
                opacity: 1;
            }
            .card:active {
                transform: translateY(-2px) scale(0.98);
            }

            .card .ripple {
                position: absolute;
                border-radius: 50%;
                background: rgba(0, 245, 255, 0.2);
                transform: scale(0);
                animation: rippleAnim 0.5s linear;
                pointer-events: none;
                z-index: 10;
            }

            @keyframes rippleAnim {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }

            .card-poster {
                position: relative;
                width: 100%;
                aspect-ratio: 2/3;
                overflow: hidden;
                background: var(--bg3);
                flex-shrink: 0;
            }

            .card-poster img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: top center;
                display: block;
                transition: transform 0.45s ease;
                filter: saturate(0.8) brightness(0.9);
            }

            .card:hover .card-poster img {
                transform: scale(1.06);
                filter: saturate(1.1) brightness(1);
            }

            .card-poster::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    to top,
                    rgba(5, 10, 18, 0.95) 0%,
                    rgba(5, 10, 18, 0.3) 45%,
                    transparent 70%
                );
                pointer-events: none;
            }

            .poster-genre {
                position: absolute;
                top: 10px;
                left: 10px;
                background: rgba(0, 245, 255, 0.15);
                border: 1px solid rgba(0, 245, 255, 0.4);
                color: var(--cyan);
                font-size: 8px;
                font-family: "Orbitron", monospace;
                font-weight: 700;
                letter-spacing: 1.5px;
                text-transform: uppercase;
                padding: 4px 9px;
                border-radius: 2px;
                z-index: 2;
            }

            .poster-rating {
                position: absolute;
                top: 10px;
                right: 10px;
                background: rgba(0, 0, 0, 0.7);
                border: 1px solid rgba(255, 230, 0, 0.4);
                color: var(--yellow);
                font-size: 11px;
                font-family: "Orbitron", monospace;
                font-weight: 700;
                padding: 4px 8px;
                border-radius: 2px;
                z-index: 2;
                display: flex;
                align-items: center;
                gap: 3px;
            }

            .poster-rating svg {
                width: 11px;
                height: 11px;
                fill: var(--yellow);
            }

            .poster-hint {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 3;
                opacity: 0;
                transition: opacity 0.25s ease;
            }
            .card:hover .poster-hint {
                opacity: 1;
            }
            .poster-hint span {
                background: transparent;
                border: 1px solid var(--cyan);
                color: var(--cyan);
                font-size: 11px;
                font-family: "Orbitron", monospace;
                font-weight: 700;
                padding: 8px 20px;
                border-radius: 2px;
                letter-spacing: 1px;
                text-shadow: 0 0 10px rgba(0, 245, 255, 0.8);
                box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
            }

            .poster-overlay-title {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                z-index: 2;
                padding: 12px 14px 14px;
            }
            .poster-overlay-title h3 {
                font-family: "Orbitron", monospace;
                font-size: 11px;
                font-weight: 700;
                color: var(--text);
                line-height: 1.3;
                margin-bottom: 2px;
                letter-spacing: 0.5px;
            }
            .poster-overlay-title span {
                font-size: 10px;
                color: var(--muted);
            }

            .card-body {
                padding: 12px 14px 14px;
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .card-desc {
                font-size: 12px;
                color: var(--muted);
                line-height: 1.55;
                font-weight: 300;
                flex: 1;
            }

            /* OVERLAY */
            .overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.8);
                backdrop-filter: blur(4px);
                z-index: 100;
                align-items: center;
                justify-content: center;
                animation: fadeIn 0.35s ease;
            }
            .overlay.show {
                display: flex;
            }
            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }

            .modal {
                background: rgba(10, 18, 32, 0.97);
                border: 1px solid rgba(0, 245, 255, 0.2);
                border-radius: 4px;
                padding: 2.5rem 2.5rem 2rem;
                max-width: 380px;
                width: 90%;
                text-align: center;
                animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
                color: var(--text);
                box-shadow: 0 0 60px rgba(0, 245, 255, 0.1);
                position: relative;
            }
            .modal::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                height: 2px;
                background: linear-gradient(90deg, var(--cyan), var(--purple), var(--magenta));
            }

            @keyframes slideUp {
                from {
                    opacity: 0;
                    transform: translateY(30px) scale(0.95);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            .modal-icon {
                width: 56px;
                height: 56px;
                border-radius: 4px;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0 auto 1.25rem;
                font-size: 26px;
            }
            .modal-icon.success {
                background: rgba(0, 245, 255, 0.1);
                border: 1px solid rgba(0, 245, 255, 0.3);
            }
            .modal-icon.error {
                background: rgba(255, 45, 120, 0.1);
                border: 1px solid rgba(255, 45, 120, 0.3);
            }

            .modal h2 {
                font-family: "Orbitron", monospace;
                font-size: 16px;
                font-weight: 700;
                margin-bottom: 0.6rem;
                letter-spacing: 1px;
                color: var(--cyan);
            }
            .modal p {
                font-size: 13px;
                color: var(--muted);
                line-height: 1.6;
                margin-bottom: 1.75rem;
                font-weight: 300;
            }

            .modal-btn {
                display: inline-block;
                background: transparent;
                border: 1px solid var(--cyan);
                color: var(--cyan);
                padding: 12px 28px;
                border-radius: 2px;
                font-size: 12px;
                font-family: "Orbitron", monospace;
                font-weight: 700;
                text-decoration: none;
                transition: background 0.2s, box-shadow 0.2s;
                letter-spacing: 1px;
            }
            .modal-btn:hover {
                background: rgba(0, 245, 255, 0.1);
                box-shadow: 0 0 20px rgba(0, 245, 255, 0.3);
            }

            .modal-link {
                display: block;
                font-size: 12px;
                color: var(--muted);
                text-decoration: none;
                margin-top: 1rem;
                transition: color 0.2s;
                font-family: "Orbitron", monospace;
                letter-spacing: 0.5px;
            }
            .modal-link:hover {
                color: var(--cyan);
            }
            .modal-divider {
                height: 1px;
                background: rgba(0, 245, 255, 0.1);
                margin: 1.25rem 0;
            }

            /* VINYL */
            .vinyl-fixed {
                position: fixed;
                bottom: 24px;
                right: 24px;
                z-index: 500;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
            }
            .vinyl-fixed img {
                width: 60px;
                height: 60px;
                border-radius: 50%;
                object-fit: cover;
                box-shadow: 0 0 20px rgba(0, 245, 255, 0.4);
                animation: vinylSpin 6s linear infinite;
                animation-play-state: paused;
            }
            .vinyl-fixed img.playing {
                animation-play-state: running;
            }
            @keyframes vinylSpin {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }
            .vinyl-mute {
                background: rgba(10, 18, 32, 0.9);
                border: 1px solid rgba(0, 245, 255, 0.3);
                border-radius: 2px;
                padding: 3px 10px;
                font-size: 11px;
                cursor: pointer;
                color: var(--cyan);
                transition: transform 0.15s, box-shadow 0.15s;
            }
            .vinyl-mute:hover {
                transform: scale(1.05);
                box-shadow: 0 0 10px rgba(0, 245, 255, 0.3);
            }

            /* GRID LINES BG */
            .grid-bg {
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
                background-image: linear-gradient(rgba(0, 245, 255, 0.03) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(0, 245, 255, 0.03) 1px, transparent 1px);
                background-size: 50px 50px;
            }
        </style>
    </head>

    <div class="vinyl-fixed" id="vinylFixed">
        <img src="img/capacyp.png" id="vinylCover" alt="capa" />
        <button class="vinyl-mute" id="muteBtn" onclick="toggleMute()">🔇</button>
    </div>
    <audio id="vinylAudio" loop>
        <source src="musicas\I Really Want to Stay at Your House_spotdown.org.mp3" type="audio/mpeg" />
    </audio>

    <body>
        <div class="grid-bg"></div>

        <header>
            <img
                src="img/matei.png"
                alt="logo"
                width="50"
                height="50"
                style="border-radius: 4px; border: 1px solid rgba(0, 245, 255, 0.3)"
            />
            <div class="logo-text">Snack<span>Night</span></div>
        </header>

        <div class="fnav-wrap">
            <nav class="fnav" id="fnav">
                <button class="fnav-item" onclick="movePill(this); window.location.href='home.html'">Todos</button>
                <button class="fnav-item" onclick="movePill(this); window.location.href='romance.html'">Romance</button>
                <button class="fnav-item" onclick="movePill(this); window.location.href='acao.html'">Ação</button>
                <button class="fnav-item" onclick="movePill(this); window.location.href='isekai.html'">Isekai</button>
                <button class="fnav-item active" onclick="movePill(this)">Cyberpunk</button>
                <button class="fnav-item" onclick="movePill(this); window.location.href='shonen.html'">Shonen</button>
            </nav>
        </div>

        <div class="hero">
            <div class="hero-tag">◈ SISTEMA ONLINE</div>
            <h1>Animes de<br /><em>Cyberpunk</em> &amp; Sci-Fi</h1>
            <p>Distopia, neon e tecnologia. Mergulhe no futuro sombrio.</p>
        </div>

        <div class="grid-section">
            <p class="section-label">▶ ARQUIVOS CARREGADOS</p>
            <div class="cards-grid" id="cardsGrid"></div>
        </div>

        <div class="overlay" id="overlay">
            <div class="modal">
                <div class="modal-icon" id="modalIcon"></div>
                <h2 id="modalTitle"></h2>
                <p id="modalMsg"></p>
                <div class="modal-divider"></div>
                <a href="#" class="modal-btn" id="modalBtn"></a>
                <a href="index.html" class="modal-link">← VOLTAR AO LOGIN</a>
            </div>
        </div>

        <script>
            const animes = [
                {
                    title: "Cyberpunk: Edgerunners",
                    genre: "Cyberpunk • Ação",
                    desc: "David Martinez, um estudante de rua, sobrevive nas sombras de Night City equipando seu corpo com implantes ilegais e se torna um mercenário chamado edgerunner.",
                    rating: "9.5",
                    eps: "10 eps",
                    img: "img/cyp1.jpg",
                    slug: "edgerunners",
                },
                {
                    title: "Ghost in the Shell",
                    genre: "Cyberpunk • Sci-Fi",
                    desc: "A Major Motoko Kusanagi lidera a Seção 9 em investigações que misturam crime cibernético, identidade e o que significa ser humano num mundo híbrido.",
                    rating: "9.1",
                    eps: "52 eps",
                    img: "img/cyp2.jpg",
                    slug: "gits",
                },
                {
                    title: "Akira",
                    genre: "Cyberpunk • Distopia",
                    desc: "Em Neo-Tokyo 2019, um motociclista rebelde descobre poderes psíquicos imensuráveis ligados a um experimento secreto do governo que pode destruir a cidade.",
                    rating: "9.3",
                    eps: "Filme",
                    img: "img/cyp3.jpg",
                    slug: "akira",
                },
                {
                    title: "Trigun Stampede",
                    genre: "Cyberpunk • Western • Sci-Fi",
                    desc: "Vash the Stampede é um pistoleiro lendário em um planeta árido, perseguido por uma recompensa absurda enquanto recusa qualquer ato de violência.",
                    rating: "8.7",
                    eps: "12 eps",
                    img: "img/cyp4.jpg",
                    slug: "trigun",
                },
                {
                    title: "Texhnolyze",
                    genre: "Cyberpunk • Psicológico",
                    desc: "Numa cidade subterrânea em colapso, um ex-lutador recebe membros biomecânicos e é arrastado para uma guerra entre facções que define o destino humano.",
                    rating: "8.5",
                    eps: "22 eps",
                    img: "img/cyp5.webp",
                    slug: "texhnolyze",
                },
                {
                    title: "Ergo Proxy",
                    genre: "Cyberpunk • Filosófico",
                    desc: "Em uma cúpula utópica pós-apocalíptica, uma inspetora investiga androides que desenvolveram consciência e descobre segredos sobre a origem da humanidade.",
                    rating: "8.8",
                    eps: "23 eps",
                    img: "img/cyp6.jpg",
                    slug: "ergoproxy",
                },
                {
                    title: "Blame!",
                    genre: "Cyberpunk • Sci-Fi • Survival",
                    desc: "Killy vaga por uma megaestrutura infinita e hostil em busca de humanos com o gene Net Terminal, única esperança para deter a construção sem fim.",
                    rating: "8.4",
                    eps: "Filme",
                    img: "img/cyp7.webp",
                    slug: "blame",
                },
                {
                    title: "Cowboy Bebop",
                    genre: "Cyberpunk • Sci-Fi • Space Western • Ação",
                    desc: "Spike Spiegel e sua tripulação viajam pelo sistema solar caçando recompensas enquanto enfrentam seus passados conturbados e perigosas organizações criminosas.",
                    rating: "8.9",
                    eps: "26 eps",
                    img: "img/cyp8.webp",
                    slug: "cowboybebop",
                },
            ];

            const starSVG = `<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
            const grid = document.getElementById("cardsGrid");

            // Renderiza os cards
            animes.forEach((a) => {
                grid.innerHTML += `
        <a class="card" href="${a.slug}.html">
            <div class="card-poster">
                <img src="${a.img}" alt="${a.title}" loading="lazy" onerror="this.style.display='none'"/>
                <div class="poster-genre">${a.genre.split("•")[0].trim()}</div>
                <div class="poster-rating">${starSVG} ${a.rating}</div>
                <div class="poster-hint"><span>ACESSAR →</span></div>
                <div class="poster-overlay-title">
                    <h3>${a.title}</h3>
                    <span>${a.eps}</span>
                </div>
            </div>
            <div class="card-body"><div class="card-desc">${a.desc}</div></div>
        </a>`;
            });

            // Configura o efeito Ripple nos cliques
            document.querySelectorAll(".card").forEach((card) => {
                card.addEventListener("click", function (e) {
                    const ripple = document.createElement("span");
                    ripple.className = "ripple";
                    const size = Math.max(this.offsetWidth, this.offsetHeight);
                    const rect = this.getBoundingClientRect();
                    ripple.style.width = ripple.style.height = size + "px";
                    ripple.style.left = e.clientX - rect.left - size / 2 + "px";
                    ripple.style.top = e.clientY - rect.top - size / 2 + "px";
                    this.appendChild(ripple);
                    setTimeout(() => ripple.remove(), 500);
                });
            });

            // Lógica do Overlay/Modal de Login
            if (!sessionStorage.getItem("overlayDismissed")) {
                const Username = localStorage.getItem("nome");
                const Password = localStorage.getItem("senha");
                const overlay = document.getElementById("overlay");
                const icon = document.getElementById("modalIcon");
                const title = document.getElementById("modalTitle");
                const msg = document.getElementById("modalMsg");
                const btn = document.getElementById("modalBtn");

                if (Username === "Lucas Lozano" && Password === "LLmar123") {
                    icon.classList.add("success");
                    icon.textContent = "⚡";
                    title.textContent = "ACESSO CONCEDIDO";
                    msg.textContent =
                        "Bem-vindo de volta, " + Username + ". Sistemas online. Escolha seu próximo anime.";
                    btn.textContent = "INICIAR →";
                    btn.href = "#";
                    btn.addEventListener("click", (e) => {
                        e.preventDefault();
                        sessionStorage.setItem("overlayDismissed", "1");
                        overlay.classList.remove("show");
                    });
                } else {
                    icon.classList.add("error");
                    icon.textContent = "⛔";
                    title.textContent = "ACESSO NEGADO";
                    msg.textContent = "Credenciais não encontradas. Deseja continuar sem autenticação?";
                    btn.textContent = "MODO VISITANTE →";
                    btn.href = "3.html";
                }
                overlay.classList.add("show");
            }

            // Lógica Corrigida do Menu Deslizante (Pill)
            const pill = document.getElementById("pill");

            function movePill(el) {
                if (!pill) return;
                pill.style.left = el.offsetLeft + "px";
                pill.style.width = el.offsetWidth + "px";
            }

            // Inicializa a posição do item ativo logo após o carregamento da janela
            window.addEventListener("load", () => {
                const active = document.querySelector(".fnav-item.active");
                if (!active || !pill) return;

                // Remove a transição temporariamente para o pill não "voar" ao entrar na página
                const originalTransition = pill.style.transition;
                pill.style.transition = "none";

                pill.style.left = active.offsetLeft + "px";
                pill.style.width = active.offsetWidth + "px";

                // Devolve o efeito de transição após o posicionamento inicial
                setTimeout(() => {
                    pill.style.transition = originalTransition;
                }, 50);
            });

            // Lógica do Vinil / Áudio
            const vinylAudio = document.getElementById("vinylAudio");
            const vinylCover = document.getElementById("vinylCover");
            const muteBtn = document.getElementById("muteBtn");
            if (vinylAudio) vinylAudio.volume = 0.045;

            document.addEventListener(
                "click",
                () => {
                    if (vinylAudio && vinylCover && muteBtn) {
                        vinylAudio.play().catch(() => {});
                        vinylCover.classList.add("playing");
                        vinylAudio.muted = false;
                        muteBtn.textContent = "🔊";
                    }
                },
                {once: true}
            );

            function toggleMute() {
                if (vinylAudio && muteBtn) {
                    vinylAudio.muted = !vinylAudio.muted;
                    muteBtn.textContent = vinylAudio.muted ? "🔇" : "🔊";
                }
            }
        </script>
    </body>
</html>
